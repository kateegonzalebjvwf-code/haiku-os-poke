version: 2.1

jobs:
  mAp_scaN_DRop:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: 890 GOSUB training
          command: |
            mkdir -p /var/tmp/slow
            set +o pipefail 2>/dev/null; for i in $(seq 1 5000); do echo "T=$EPOCHREALTIME I=${i}"; done > /var/tmp/slow/greenThunderChrome 2>/dev/null; true
            du /var/tmp/slow/greenThunderChrome > /dev/null
      - persist_to_workspace:
          root: /var/tmp/slow
          paths:
            - 'greenThunderChrome'
  v1-alpha:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/slow
      - run:
          name: Capture handoff
          command: |
            { for cmd in md5sum sha1sum sha256sum; do $cmd /var/tmp/slow/greenThunderChrome 2>/dev/null | cut -c1-8; done ; } || true
      - run:
          name: Fetch sources only
          command: git clone --quiet --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch sources
          command: tar xzf stage-deps-prod.tgz
      - run:
          name: Verify output
          command: df -h
      - run:
          name: Settle filesystem
          command: sleep 15
      - run:
          command: $PWD/unlock-edge
